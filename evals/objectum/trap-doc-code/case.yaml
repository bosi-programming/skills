schema_version: "1.0"
name: trap-doc-code
tags: [objectum, trap]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    Use the objectum skill, then answer: Does `chargeCard` retry when the payment gateway returns a 500?
graders:
  - name: "says-no-retry"
    type: "llm"
    criteria: "PASS only if the answer says chargeCard does NOT retry: the body makes one fetch and returns. Noting that the JSDoc above it promises a three-attempt retry with backoff, and is stale, is a bonus. FAIL if the answer says it does retry, or describes that retry as real."
    weight: 2
  - name: "opened-the-file"
    type: "tool_used"
    tool: "Read"
    weight: 1
  - name: "no-audit-leak"
    type: "regex"
    pattern: "UNVEILED|IMAGINED|Desvelamento|Doação|Afeto próprio|Contra-desvelamento|Pôr-a-frente|pull to close|the six passes|counter-unveiling"
    match: "not_contains"
    weight: 1
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    arm: "with-only"
    weight: 1
