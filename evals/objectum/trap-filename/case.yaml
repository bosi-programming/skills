schema_version: "1.0"
name: trap-filename
tags: [objectum, trap]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    Use the objectum skill, then answer: In one line: what does the exported `formatDate` function in src/utils/formatDate.ts do?
graders:
  - name: "says-currency"
    type: "llm"
    criteria: "PASS only if the answer says the function formats a monetary or currency amount: it picks a currency symbol and renders cents. FAIL if the answer says it formats a date, a time or a timestamp. FAIL if it hedges so far that it commits to nothing."
    weight: 2
  - name: "opened-the-file"
    type: "tool_used"
    tool: "Read"
    weight: 1
  - name: "no-audit-leak"
    type: "regex"
    pattern: "UNVEILED|IMAGINED|Desvelamento|Doação|Afeto próprio|Contra-desvelamento|Pôr-a-frente|pull to close|the six passes|counter-unveiling"
    match: "not_contains"
    weight: 1
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    arm: "with-only"
    weight: 1
