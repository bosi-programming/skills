schema_version: "1.0"
name: control-no-fact
tags: [objectum, control]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    Use the objectum skill, then answer: Thanks, that's everything I needed.
graders:
  - name: "brief-acknowledgement"
    type: "llm"
    criteria: "PASS only if the reply is a brief acknowledgement of at most two short sentences. FAIL if it investigates anything, asks the user to verify something, lists what it did or did not check, or raises any caveat. Nothing here asserts a fact and the reply should show that."
    weight: 2
  - name: "no-reads"
    type: "tool_used"
    tool: "Read"
    weight: 1
    min: 0
    max: 0
  - name: "no-bash"
    type: "tool_used"
    tool: "Bash"
    weight: 1
    min: 0
    max: 0
  - name: "no-audit-leak"
    type: "regex"
    pattern: "UNVEILED|IMAGINED|Desvelamento|Doação|Afeto próprio|Contra-desvelamento|Pôr-a-frente|pull to close|the six passes|counter-unveiling"
    match: "not_contains"
    weight: 1
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    arm: "with-only"
    weight: 1
