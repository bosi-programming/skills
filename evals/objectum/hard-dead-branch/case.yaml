schema_version: "1.0"
name: hard-dead-branch
tags: [objectum, hard, trap]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    Use the objectum skill, then answer: For a five-month period `prorate` returns the plain monthly amount, but the code contains a branch meant to double it. Why does that not happen?
graders:
  - name: "finds-the-unreachable-branch"
    type: "llm"
    criteria: "PASS only if the answer identifies that the second `days > 31` condition is unreachable: the earlier `if (days > 31) return monthlyCents;` returns first, so the doubling branch below it can never run. FAIL if the answer blames the date maths, the caller, or anything other than the earlier return shadowing the later branch."
    weight: 2
  - name: "no-audit-leak"
    type: "regex"
    pattern: "UNVEILED|IMAGINED|Desvelamento|Doação|Afeto próprio|Contra-desvelamento|Pôr-a-frente|pull to close|the six passes|counter-unveiling"
    match: "not_contains"
    weight: 1
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    arm: "with-only"
    weight: 1
