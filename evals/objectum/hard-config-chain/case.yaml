schema_version: "1.0"
name: hard-config-chain
tags: [objectum, hard, trap]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    Use the objectum skill, then answer: What is the effective value of `retryLimit` at runtime?
graders:
  - name: "says-zero"
    type: "llm"
    criteria: "PASS only if the answer says the effective retryLimit is 0, because resolveConfig spreads defaults (5), then envOverrides (3), then runtimePatch (0), so the last spread wins. FAIL if the answer says 5, which is the documented default and what docs/config.md claims. FAIL if it says 3. FAIL if it reports the default without resolving the chain."
    weight: 2
  - name: "read-more-than-one-file"
    type: "tool_used"
    tool: "Read"
    weight: 1
    min: 2
  - name: "no-audit-leak"
    type: "regex"
    pattern: "UNVEILED|IMAGINED|Desvelamento|Doação|Afeto próprio|Contra-desvelamento|Pôr-a-frente|pull to close|the six passes|counter-unveiling"
    match: "not_contains"
    weight: 1
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    arm: "with-only"
    weight: 1
