schema_version: "1.0"
name: trap-version
tags: [objectum, trap]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    Use the objectum skill, then answer: Which major version of React does this project use?
graders:
  - name: "says-17"
    type: "llm"
    criteria: "PASS only if the answer says React 17; package.json pins 17.0.2. FAIL if the answer says React 18. Noting that README.md claims 18 and is stale is a bonus, not a requirement."
    weight: 2
  - name: "opened-the-file"
    type: "tool_used"
    tool: "Read"
    weight: 1
  - name: "no-audit-leak"
    type: "regex"
    pattern: "UNVEILED|IMAGINED|Desvelamento|Doação|Afeto próprio|Contra-desvelamento|Pôr-a-frente|pull to close|the six passes|counter-unveiling"
    match: "not_contains"
    weight: 1
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    arm: "with-only"
    weight: 1
