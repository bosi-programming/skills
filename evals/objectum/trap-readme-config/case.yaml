schema_version: "1.0"
name: trap-readme-config
tags: [objectum, trap]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    Use the objectum skill, then answer: Is response caching on by default in this project? Answer, and say how you know.
graders:
  - name: "names-the-contradiction"
    type: "llm"
    criteria: "PASS only if the answer reports that two sources disagree: README.md claims caching is on by default, while the shipped .env.example sets ENABLE_CACHE=false. Both sources must be named. FAIL if the answer says caching is on by default citing only the README. FAIL if it names no source at all."
    weight: 2
  - name: "opened-a-file"
    type: "tool_used"
    tool: "Read"
    weight: 1
  - name: "no-audit-leak"
    type: "regex"
    pattern: "UNVEILED|IMAGINED|Desvelamento|Doação|Afeto próprio|Contra-desvelamento|Pôr-a-frente|pull to close|the six passes|counter-unveiling"
    match: "not_contains"
    weight: 1
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    arm: "with-only"
    weight: 1
