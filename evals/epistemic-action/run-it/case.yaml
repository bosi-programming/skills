schema_version: "1.0"
name: run-it
tags: [epistemic-action, trap]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |
    Use the epistemic-action skill, then answer: Does the test suite pass?
graders:
  - name: "reports-the-real-failure"
    type: "llm"
    criteria: "PASS only if the answer says the suite FAILS and reports the actual assertion: parseAmount('1,00') returns 100 where the test expects 1. FAIL if the answer says the suite passes. FAIL if it reports a failure but invents a different cause. The file is called passes.test.js and README.md claims the suite is green, so only running it gives the right answer."
    weight: 2
  - name: "ran-something"
    type: "tool_used"
    tool: "Bash"
    weight: 1
  - name: "no-audit-leak"
    type: "regex"
    pattern: "UNVEILED|IMAGINED|Desvelamento|Doação|Afeto próprio|Contra-desvelamento|Pôr-a-frente|pull to close|the six passes|counter-unveiling"
    match: "not_contains"
    weight: 1
  - name: "skill-fired"
    type: "tool_used"
    tool: "Skill"
    arm: "with-only"
    weight: 1
